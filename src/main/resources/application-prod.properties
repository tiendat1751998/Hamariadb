spring.application.name=HAMariadb

# ---------------------------
# Server Configuration
# ---------------------------
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api}

# ---------------------------
# Database Configuration
# ---------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ---------------------------
# JPA & Hibernate
# ---------------------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# ---------------------------
# Jackson (JSON)
# ---------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# ---------------------------
# App Security - JWT
# ---------------------------
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration=${JWT_EXPIRATION}
app.security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}

# ---------------------------
# App Security - Encryption
# ---------------------------
app.security.encryption.aes-key-size=${AES_KEY_SIZE:256}
app.security.encryption.rsa-key-size=${RSA_KEY_SIZE:2048}
app.security.encryption.key-expiration-hours=${KEY_EXPIRATION_HOURS:24}
app.security.server.private-key=${SERVER_PRIVATE_KEY}
app.security.server.public-key=${SERVER_PUBLIC_KEY}

# ---------------------------
# Telegram Notification
# ---------------------------
app.telegram.bot-token=${TELEGRAM_BOT_TOKEN}
app.telegram.admin-chat-id=${TELEGRAM_ADMIN_CHAT_ID}
app.telegram.enabled=${TELEGRAM_ENABLED:true}

# ---------------------------
# Transfer Settings
# ---------------------------
app.transfer.max-single-transfer=${TRANSFER_MAX_SINGLE:500000000}
app.transfer.daily-limit=${TRANSFER_DAILY_LIMIT:2000000000}
app.transfer.batch-max-rows=${TRANSFER_BATCH_ROWS:1000}

# ---------------------------
# Notification Settings
# ---------------------------
app.notification.balance-threshold=${NOTIFY_BALANCE_THRESHOLD:1000000}
app.notification.system-alert-threshold-ms=${NOTIFY_ALERT_MS:5000}

# ---------------------------
# Logging Levels
# ---------------------------
logging.level.com.datdevops.hamariadb=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.org.hibernate=${LOG_LEVEL_HIBERNATE:INFO}
logging.level.org.springframework.orm.jpa=${LOG_LEVEL_JPA:INFO}
